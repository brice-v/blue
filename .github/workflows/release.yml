name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # cgo deps for fyne/GL static tests (upx used by compress steps below is also here).
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install upx gcc libgl1-mesa-dev xorg-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      # rgfw: raylib's windowing backend. Do NOT build raylib's bundled GLFW
      # alongside fyne's static GLFW (duplicate symbols).
      - name: Test
        run: go test -tags="rgfw" ./...

      # Same as make_release_static: race detector needs cgo enabled.
      - name: Test Static
        env:
          CGO_ENABLED: 1
        run: go test -tags="static" -race ./...

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: go build -tags="rgfw" -ldflags='-s -w -extldflags "-static"' -o blue-win.exe .

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: go build -tags="rgfw" -ldflags='-s -w' -o blue-linux .

      - name: Build Macos
        if: matrix.os == 'macos-latest'
        run: go build -tags="rgfw" -ldflags='-s -w' -o blue-mac-arm64 .

      # Static builds ("blues-" prefix), mirroring make_release_static:
      # cgo off so binaries are self-contained.
      - name: Build Static Windows
        if: matrix.os == 'windows-latest'
        env:
          CGO_ENABLED: 0
        run: go build -tags="static" -ldflags='-s -w -extldflags "-static"' -o blues-win.exe .

      - name: Build Static Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
        run: go build -tags="static" -ldflags='-s -w -extldflags "-static"' -o blues-linux .

      - name: Build Static Macos
        if: matrix.os == 'macos-latest'
        env:
          CGO_ENABLED: 0
        run: go build -tags="static" -ldflags='-s -w' -o blues-mac-arm64 .

      # WASM build (on ubuntu-latest runner alongside Build Linux).
      - name: Build & package WASM
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
          GOOS: js
          GOARCH: wasm
        run: |
          go build -tags "static,wasm" -trimpath -ldflags="-s -w" -o ./playground/blue.wasm ./wasmmain
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./playground/
          zip -r playground-wasm.zip ./playground/

      # upx-action installs upx itself; `files` takes newline-separated globs.
      - name: Compress Windows binaries
        if: matrix.os == 'windows-latest'
        uses: svenstaro/upx-action@v2
        with:
          files: |
            blue-win.exe
            blues-win.exe

      - name: Compress Linux binaries
        if: matrix.os == 'ubuntu-latest'
        uses: svenstaro/upx-action@v2
        with:
          files: |
            blue-linux
            blues-linux

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            ./blue-win.exe
            ./blue-linux
            ./blue-mac-arm64
            ./blues-win.exe
            ./blues-linux
            ./blues-mac-arm64
          if-no-files-found: ignore

      - name: Upload wasm artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: ./playground-wasm.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          files: |
            ./artifacts/binaries-ubuntu-latest/blue-linux
            ./artifacts/binaries-ubuntu-latest/blues-linux
            ./artifacts/binaries-windows-latest/blue-win.exe
            ./artifacts/binaries-windows-latest/blues-win.exe
            ./artifacts/binaries-macos-latest/blue-mac-arm64
            ./artifacts/binaries-macos-latest/blues-mac-arm64
            ./artifacts/wasm/playground-wasm.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
