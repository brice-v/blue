name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # cgo deps for fyne/GL static tests (upx used by compress steps below is also here).
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx gcc libgl1-mesa-dev xorg-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      # rgfw: raylib's windowing backend. Do NOT build raylib's bundled GLFW
      # alongside fyne's static GLFW (duplicate symbols).
      - name: Test
        run: go test -tags="rgfw" ./...

      - name: Test Static
        env:
          CGO_ENABLED: 1
        run: go test -tags="static" -race ./...

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: go build -tags="rgfw" -ldflags='-s -w -extldflags "-static"' -o blue.exe .

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: go build -tags="rgfw" -ldflags='-s -w' -o blue .

      - name: Build Macos
        if: matrix.os == 'macos-latest'
        run: go build -tags="rgfw" -ldflags='-s -w' -o blue .

      - name: Build Static Windows
        if: matrix.os == 'windows-latest'
        env:
          CGO_ENABLED: 0
        run: go build -tags="static" -ldflags='-s -w -extldflags "-static"' -o blues.exe .

      - name: Build Static Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
        run: go build -tags="static" -ldflags='-s -w -extldflags "-static"' -o blues .

      - name: Build Static Macos
        if: matrix.os == 'macos-latest'
        env:
          CGO_ENABLED: 0
        run: go build -tags="static" -ldflags='-s -w' -o blues .

      - name: Build & package WASM
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
          GOOS: js
          GOARCH: wasm
        run: |
          go build -tags "static,wasm" -trimpath -ldflags="-s -w" -o ./playground/blue.wasm ./wasmmain
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./playground/
          zip -r playground-wasm.zip ./playground/

      - name: Compress Windows binaries
        if: matrix.os == 'windows-latest'
        uses: svenstaro/upx-action@v2
        with:
          files: |
            blue.exe
            blues.exe

      - name: Compress Linux binaries
        if: matrix.os == 'ubuntu-latest'
        uses: svenstaro/upx-action@v2
        with:
          files: |
            blue
            blues

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: |
            ./blue
            ./blues
            ./blue.exe
            ./blues.exe
          if-no-files-found: ignore

      - name: Upload wasm artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: ./playground-wasm.zip

  vsix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build VSIX
        working-directory: editors/code
        run: |
          npm ci --no-audit --no-fund
          yes | npx @vscode/vsce package --no-yarn --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: editors/code/blue-vscode-*.vsix

  release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Package binaries
        run: |
          mkdir -p ./zips && cd ./artifacts
          (cd binaries-ubuntu-latest  && tar -czf ../../zips/blue-linux-amd64.tar.gz blue   && tar -czf ../../zips/blues-linux-amd64.tar.gz blues)
          (cd binaries-windows-latest && zip -9q ../../zips/blue-windows-amd64.exe.zip blue.exe  && zip -9q ../../zips/blues-windows-amd64.exe.zip blues.exe)
          (cd binaries-macos-latest   && tar -czf ../../zips/blue-macos-arm64.tar.gz blue     && tar -czf ../../zips/blues-macos-arm64.tar.gz blues)

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            ./zips/blue-linux-amd64.tar.gz
            ./zips/blues-linux-amd64.tar.gz
            ./zips/blue-windows-amd64.exe.zip
            ./zips/blues-windows-amd64.exe.zip
            ./zips/blue-macos-arm64.tar.gz
            ./zips/blues-macos-arm64.tar.gz
            ./artifacts/wasm/playground-wasm.zip
            ./artifacts/vsix/*.vsix
          draft: true
